version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: miniledger-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: miniledger_db
    ports:
      - "5432:5432"
    volumes:
      - miniledger_pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  miniledger_pgdata:
